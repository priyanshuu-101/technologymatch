document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ame as last year, which sounds alright until you see how much of it is already spoken for.<\u002Fp>\n          <p style=\"margin:0;max-width:52ch\">Four quarters. Stuff is going to come up. Let's see how you do.<\u002Fp>\n          <div><button type=\"button\" sc-camel-on-click=\"{{ start }}\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;background:#FDD265;color:#000;border:2px solid #FDD265;border-radius:4px;padding:12px 26px;min-height:44px;cursor:pointer\" style-hover=\"background:#EDB835;border-color:#EDB835\">Start<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isGate }}\">\n      <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;gap:18px\">\n        <p style=\"margin:0;color:#FFFFFF;font-size:18px;font-weight:600\">Before we start.<\u002Fp>\n        <p style=\"margin:0;max-width:52ch;color:#C19528;font-size:14px\">Fill this in and you're straight into the year.<\u002Fp>\n        <div style=\"background:#F3F0E8;color:#000;font-family:Lato,sans-serif;padding:20px;border:1px solid #C19528\">\n          <div class=\"hs-form-frame\" data-region=\"na1\" data-form-id=\"39e36071-292a-4678-b5b9-73bdbfdc8fa9\" data-portal-id=\"43646120\"><\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ formFailed }}\">\n        <div style=\"display:flex;align-items:center;gap:10px;color:#C19528;font-size:13px\">\n          <span>&gt;<\u002Fspan>\n          <button type=\"button\" sc-camel-on-click=\"{{ skipGate }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:13px;background:transparent;border:1px solid #C19528;border-radius:4px;color:#FDD265;padding:10px 16px;min-height:44px;cursor:pointer\" style-hover=\"background:#FDD265;color:#000\">Form won't load — carry on without it<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isSetup }}\">\n      <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;gap:26px\">\n        <p style=\"margin:0;color:#FFFFFF;font-size:18px;font-weight:600\">Three quick things.<\u002Fp>\n        <sc-for list=\"{{ setupQs }}\" as=\"q\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:10px\">\n            <p style=\"margin:0;color:#C19528;font-size:15px\">{{ q.title }}<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n              <sc-for list=\"{{ q.opts }}\" as=\"o\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;background:{{ o.bg }};color:{{ o.fg }};border:1px solid #C19528;border-radius:4px;padding:11px 16px;min-height:44px;cursor:pointer\" style-hover=\"background:#FDD265;color:#000\">{{ o.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isAlloc }}\">\n      <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;gap:16px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;color:#C19528;max-width:60ch\">\n          <p style=\"margin:0\">Here's your budget. Most of it's already gone before you've done anything — renewals, licences, the people on your team. The greyed out stuff isn't yours to move.<\u002Fp>\n          <p style=\"margin:0\">What's left is the bit you actually get to decide on.<\u002Fp>\n          <p style=\"margin:0;color:#FDD265\">Everything on this list wants two chips. You've got six. So half of this is going short and you get to pick which half.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <sc-for list=\"{{ lockedRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;align-items:center;gap:12px;background:#D9D9D9;color:#000000;padding:11px 12px;font-size:14px\">\n              <svg width=\"11\" height=\"14\" sc-camel-view-box=\"0 0 11 14\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none\">\n                <rect x=\"1\" y=\"6\" width=\"9\" height=\"7\" stroke=\"#000000\" stroke-width=\"1.5\"><\u002Frect>\n                <path d=\"M3 6V4a2.5 2.5 0 015 0v2\" stroke=\"#000000\" stroke-width=\"1.5\"><\u002Fpath>\n              <\u002Fsvg>\n              <span style=\"flex:1;min-width:0\">{{ row.name }}<\u002Fspan>\n              <span style=\"font-size:13px\">{{ row.count }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-for list=\"{{ liveRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"display:flex;align-items:center;gap:8px;padding:2px 0;border-bottom:1px solid #333\">\n              <div style=\"flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 4px;font-family:'IBM Plex Mono',monospace;font-size:14px;color:{{ row.nameColor }}\">\n                <sc-if value=\"{{ row.isActive }}\"><span style=\"display:inline-block;width:8px;height:14px;background:#FDD265;flex:none;animation:bs-blink 1s step-end infinite\"><\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{ row.notActive }}\"><span style=\"display:inline-block;width:8px;flex:none\"><\u002Fspan><\u002Fsc-if>\n                <span style=\"flex:1;min-width:0\">{{ row.name }}<\u002Fspan>\n                <span aria-label=\"{{ row.aria }}\" style=\"letter-spacing:2px;color:#FDD265;font-size:15px\">{{ row.dots }}<\u002Fspan>\n                <span style=\"color:#666666;font-size:13px;flex:none\">{{ row.ratio }}<\u002Fspan>\n              <\u002Fdiv>\n              <button type=\"button\" sc-camel-on-click=\"{{ row.remove }}\" disabled=\"{{ row.noneOn }}\" aria-label=\"{{ row.removeAria }}\" style=\"flex:none;width:44px;min-height:44px;background:transparent;border:1px solid #666666; argin:0;color:#FFFFFF;font-size:18px;font-weight:600\">One more thing before you start.<\u002Fp>\n        <p style=\"margin:0;max-width:52ch\">Which of these do you reckon is going to bite you this year?<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <sc-for list=\"{{ predictOpts }}\" as=\"p\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{ p.pick }}\" style=\"display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid #333;padding:12px 8px;min-height:44px;cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:15px;color:#FDD265\" style-hover=\"background:#1a1a1a\">\n              <span style=\"flex:1;min-width:0\">{{ p.name }}<\u002Fspan>\n              <span style=\"flex:none;color:#666666;font-size:13px\">{{ p.ratio }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isNode }}\">\n      <div style=\"position:relative;z-index:2;display:flex;flex-direction:column;gap:18px\">\n        <div style=\"display:flex;justify-content:space-between;gap:12px;color:#C19528;font-size:13px;border-bottom:1px solid #333;padding-bottom:8px\">\n          <span>{{ statusQuarter }}<\u002Fspan>\n          <span>{{ statusMoney }}<\u002Fspan>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ showBranchLine }}\">\n        <p style=\"margin:0;max-width:58ch;color:#C19528;font-size:14px\">{{ branchLine }}<\u002Fp>\n        <\u002Fsc-if>\n\n        <p style=\"margin:0;max-width:58ch;white-space:pre-wrap\">{{ sceneText }}<sc-if value=\"{{ cursorScene }}\"><span style=\"display:inline-block;width:9px;height:15px;background:#FDD265;vertical-align:-2px;animation:bs-blink 1s step-end infinite\"><\u002Fspan><\u002Fsc-if><\u002Fp>\n\n        <sc-if value=\"{{ showPredictResult }}\">\n        <p style=\"margin:0;max-width:58ch;color:#FFFFFF;fon op:16px\">\n          <p style=\"margin:0;max-width:58ch;color:#FFFFFF\">{{ verdictText }}<sc-if value=\"{{ cursorVerdict }}\"><span style=\"display:inline-block;width:9px;height:15px;background:#FFFFFF;vertical-align:-2px;animation:bs-blink 1s step-end infinite\"><\u002Fspan><\u002Fsc-if><\u002Fp>\n          <sc-if value=\"{{ showVerdictQuote }}\">\n          <blockquote style=\"margin:0;border-left:2px solid #C19528;padding-left:14px;display:flex;flex-direction:column;gap:6px;max-width:56ch\">\n            <span style=\"color:#C19528;font-size:14px\">{{ verdictQuote }}<\u002Fspan>\n            <span style=\"color:#C19528;font-size:13px\">— {{ verdictQuoteAttr }}<\u002Fspan>\n          <\u002Fblockquote>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showCloseLine }}\">\n          <blockquote style=\"margin:0;border-left:2px solid #EDB835;padding-left:14px;color:#EDB835;font-size:14px;max-width:56ch\">{{ closeLine }}<\u002Fblockquote>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;align-items:center;gap:10px;color:#C19528;font-size:14px;margin-top:2px\">\n          <span>&gt;<\u002Fspan>\n          <sc-if value=\"{{ canContinue }}\">\n            <button type=\"button\" sc-camel-on-click=\"{{ next }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:14px;background:transparent;border:0;padding:10px 0;min-height:44px;color:#C19528;cursor:pointer;text-align:left\" style-hover=\"color:#FDD265\">tap anywhere to carry on<\u002Fbutton>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ awaitingChoice }}\"><span>choose one<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ cursorPrompt }}\"><span style=\"display:inline-block;width:9px;height:15px;background:#C19528;animation:bs-blink 1s step-end infinite\"><\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isScore }}\">\n      <div style=\"position:relative;z-index:2;display:flex;f olid {{ opt.boxBg }}\">{{ opt.letter }}<\u002Fspan>\n                <span style=\"flex:1;min-width:0\">{{ opt.label }}<\u002Fspan>\n                <span style=\"flex:none;color:#C19528;font-size:13px;text-align:right\">{{ opt.right }}<\u002Fspan>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ boardResult }}\">\n        <div style=\"display:flex;flex-direction:{{ boardDir }};gap:0;border:1px solid #333\">\n          <div style=\"flex:1;min-width:0;background:#EDB835;color:#000;padding:20px;font-family:Lato,sans-serif;display:flex;flex-direction:column;gap:12px\">\n            <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:17px\">This is what you said<\u002Fh2>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ saidLines }}\" as=\"line\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.45\">\n                  <span style=\"flex:none;font-size:9px;line-height:1.9\">◆<\u002Fspan>\n                  <span style=\"flex:1;min-width:0\">{{ line }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-width:0;background:#000;padding:20px;display:flex;flex-direction:column;gap:12px\">\n            <h2 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:#C19528\">This is what they actually heard<\u002Fh2>\n            <p style=\"margin:0;color:#FFFFFF;font-size:15px;line-height:1.55;white-space:pre-wrap\">{{ verdictText }}<sc-if value=\"{{ cursorVerdict }}\"><span style=\"display:inline-block;width:9px;height:15px;background:#FFFFFF;vertical-align:-2px;animation:bs-blink 1s step-end infinite\"><\u002Fspan><\u002Fsc-if><\u002Fp>\n            <sc-if value=\"{{ showVerdictQuote }}\">\n            <blockquote style=\"margin:0;border-left:2px solid #C19528;padding-left:14px;display:flex;flex-direction:column;gap:6px\">\n              <span style=\"color:#C19528;font-size:14px\">{{ verdictQuote }}<\u002Fspan>\n              <span style=\"color:#C19528;font-size:13px\">— {{ verdictQuoteAttr }}<\u002Fspan>\n            <\u002Fblockquote>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ showDeltas }}\">\n            <div style=\"color:#C19528;font-size:13px\">{{ boardDeltas }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #333;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <h2 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;color:#FFFFFF\">How you got here<\u002Fh2>\n          <div style=\"display:flex;flex-direction:column;gap:7px\">\n            <sc-for list=\"{{ receipt }}\" as=\"r\" hint-placeholder-count=\"4\">\n              <p style=\"margin:0;color:#FDD265;font-size:14px;line-height:1.5;max-width:58ch\">{{ r }}<\u002Fp>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:baseline;gap:14px\">\n          <span style=\"font-family:Gluten,cursive;font-weight:800;font-size:clamp(64px,18vw,104px);line-height:0.9;color:#EDB835\">{{ total }}<\u002Fspan>\n          <span style=\"color:#C19528;font-size:14px\">out of 100<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ showReplayDelta }}\">\n        <div style=\"color:#FDD265;font-size:14px\">{{ replayDelta }}<\u002Fdiv>\n        <\u002Fsc-if>\n\n        <div style=\"display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ bars }}\" as=\"bar\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <div style=\"display:flex;justify-content:space-between;font-size:13px;color:#C19528\">\n                <span>{{ bar.label }}<\u002Fspan>\n                <span>{{ bar.value }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:14px;background:#1a1a1a;border:1px solid #333\">\n                <div style=\"height:100%;background:{{ bar.color }};width:{{ bar.pct }}%;transition:width 700ms ease {{ bar.delay }}ms\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border:1px solid #C19528;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <h2 style=\"margin:0;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:18px;color:#FFFFFF\">{{ archName }}<\u002Fh2>\n          <p style=\"margin:0;color:#FDD265;font-size:14px;line-height:1.6;max-width:56ch\">{{ archText }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-direction:column;gap:16px;max-width:58ch\">\n          <p style=\"margin:0;font-size:14px;line-height:1.6\"><span style=\"color:#FFFFFF;font-weight:600\">{{ oneMoveHead }}<\u002Fspan> <span style=\"color:#FDD265\">{{ oneMoveBody }}<\u002Fspan><\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#FDD265\">{{ watchText }}<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"border-top:1px solid #333;padding-top:18px;display:flex;flex-direction:column;gap:14px;max-width:58ch\">\n          <p style=\"margin:0;font-size:14px;line-height:1.6\"><span style=\"color:#FFFFFF;font-weight:600\">One last thing.<\u002Fspan> <span style=\"color:#FDD265\">You probably played this like the budget was fixed. It mostly isn't.<\u002Fspan><\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#FDD265\">Three times this year there was an option to turn a problem into a conversation about money — the AI thing in Q2, the board's question in Q3, and whatever broke in Q4. Most people don't take any of them.<\u002Fp>\n          <p style=\"margin:0;font-size:14px;line-height:1.6;color:#FDD265\">This came up over and over in the calls we listened to. The money is more flexible than the spreadsheet makes it look, if you can explain why.<\u002Fp>\n          <blockquote style=\"margin:0;border-left:2px solid #C19528;padding-left:14px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"color:#C19528;font-size:14px\">\"We do not have money budgeted this year for it. But I have been told that if we can show ROI, we potentially could get off budget for this type of work.\"<\u002Fspan>\n            <span style=\"color:#C19528;font-size:13px\">— IT leader, manufacturing<\u002Fspan>\n          <\u002Fblockquote>\n          <blockquote style=\"margin:0;border-left:2px solid #C19528;padding-left:14px;display:flex;flex-direction:column;gap:6px\">\n            <span style=\"color:#C19528;font-size:14px\">\"Our budget is, if it fits, we buy it. We don't do a yearly thing. It's pretty much a business decision and then we find the money.\"<\u002Fspan>\n            <span style=\"color:#C19528;font-size:13px\">— IT evaluator and recommender<\u002Fspan>\n          <\u002Fblockquote>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n          <button type=\"button\" sc-camel-on-click=\"{{ openOnePager }}\" style=\"font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;background:#FDD265;color:#000;border:2px solid #FDD265;border-radius:4px;padding:12px 22px;min-height:44px;cursor:pointer\" style-hover=\"background:#EDB835;border-color:#EDB835\">Get your one-pager<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ replay }}\" style=\"font-family:'IBM Plex Mono',monospace;font-size:15px;background:transparent;color:#FDD265;border:1px solid #C19528;border-radius:4px;padding:12px 22px;min-height:44px;cursor:pointer\" style-hover=\"background:#FDD265;color:#000\">Play it again<\u002Fbutton>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 4px 2px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#666666\">\n      <span style=\"width:9px;height:9px;border-radius:50%;background:#EDB835;flex:none\"><\u002Fspan>\n      <span style=\"flex:1;min-width:80px\">budget season<\u002Fspan>\n      <div style=\"display:flex;gap:8px;flex:none\" aria-label=\"{{ stripAria }}\">\n        <sc-for list=\"{{ strip }}\" as=\"p\" hint-placeholder-count=\"6\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:3px;width:30px\">\n            <span style=\"font-size:10px;letter-spacing:0.5px;color:{{ p.color }}\">{{ p.tag }}<\u002Fspan>\n            <span style=\"width:26px;height:6px;background:{{ p.color }};opacity:{{ p.opacity }}\"><\u002Fspan>\n            <span style=\"font-size:10px;color:{{ p.color }}\">{{ p.count }}<\u002Fspan>\n            <span style=\"width:4px;height:4px;border-radius:50%;background:{{ p.dot }}\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex:none\" aria-label=\"{{ bezelAria }}\">\n        <sc-for list=\"{{ bezelBars }}\" as=\"b\" hint-placeholder-count=\"3\">\n          <div style=\"width:44px;height:5px;background:#D9D9D9\">\n            <div style=\"height:100%;background:#EDB835;width:{{ b.pct }}%\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isOnePager }}\">\n<div style=\"width:100%;max-width:820px;background:#F3F0E8;display:flex;flex-direction:column;gap:34px;padding:clamp(12px,3vw,24px) 0\">\n\n  <div style=\"display:flex;flex-direction:column;gap:10px;border-bottom:3px solid #000;padding-bottom:18px\">\n    <h1 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.1\">Budget Season — your one-pager<\u002Fh1>\n    <p style=\"margin:0;font-size:17px;line-height:1.5\">{{ onePagerSub }}<\u002Fp>\n  <\u002Fdiv>\n\n  <section style=\"display:flex;flex-direction:column;gap:14px\">\n    <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:21px\">1 — What you traded away, and why<\u002Fh2>\n    <sc-for list=\"{{ tradeLines }}\" as=\"t\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex;gap:14px;align-items:flex-start\">\n        <span style=\"flex:none;font-family:Lato,sans-serif;font-weight:900;font-size:15px;background:#000;color:#F3F0E8;width:26px;height:26px;display:flex;align-items:center;justify-content:center\">{{ t.q }}<\u002Fspan>\n        <div style=\"flex:1;min-width:0;display:flex;flex-direction:column;gap:5px\">\n          <p style=\"margin:0;font-weight:700;font-size:16px\">{{ t.choice }}<\u002Fp>\n          <p style=\"margin:0;font-size:16px;line-height:1.55;color:#000\">{{ t.why }}<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:12px\">\n    <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:21px\">2 — What it costs if the stuff you skipped goes wrong<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.55\">{{ predictedLead }}<\u002Fp>\n    <p style=\"margin:0;font-size:16px;line-height:1.55\">{{ skippedLine }}<\u002Fp>\n    <p style=\"margin:0;font-size:16px;line-height:1.55\"><span style=\"background:#FDD265;padding:1px 3px\">{{ skippedEvent }}<\u002Fspan><\u002Fp>\n    <p style=\"margin:0;font-size:15px;line-height:1.55;color:#666666\">{{ skippedStat }}<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:14px;position:relative\">\n    <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:21px\">3 — Three questions your CFO is going to ask, and what to say<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <p style=\"margin:0;font-size:16px;font-weight:700\">\"What did we actually get for that?\"<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55\">Name the thing that didn't happen and put a number next to it. If you can't put a number on it, say so and give her the one you can — what the fix cost, against what a day of it being down costs the business.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <p style=\"margin:0;font-size:16px;font-weight:700\">\"Can it wait a year?\"<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55\">Sometimes yes, and say so when it is — you'll be believed the time you say no. When it can't wait, tell her what changes in twelve months: the support contract ends, the hardware goes out of support, the auditor comes back.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:6px\">\n      <p style=\"margin:0;font-size:16px;font-weight:700\">\"Why isn't this in the budget?\"<\u002Fp>\n      <p style=\"margin:0;font-size:16px;line-height:1.55\">Because the budget was set before the thing happened. That's not an argument against spending, it's an argument for the money being outside the annual cycle — one leader we spoke to put it plainly: if we can show ROI, we potentially could get off budget for this type of work.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:14px\">\n    <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:21px\">4 — The full version of the advice<\u002Fh2>\n    <p style=\"margin:0;font-size:16px;line-height:1.6\"><span style=\"font-weight:700\">Here's what actually happened.<\u002Fspan> {{ fullAdvice }}<\u002Fp>\n    <div style=\"display:flex;gap:16px;align-items:flex-start\">\n      <svg width=\"34\" height=\"54\" sc-camel-view-box=\"0 0 34 54\" fill=\"none\" aria-hidden=\"true\" style=\"flex:none;margin-top:4px\">\n        <path d=\"M6 3c14 6 22 18 20 34\" stroke=\"#C19528\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n        <path d=\"M19 33l7 5 1-9\" stroke=\"#C19528\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath>\n      <\u002Fsvg>\n      <p style=\"margin:0;font-family:'Gloria Hallelujah',cursive;font-size:15px;line-height:1.6;color:#000;padding-top:6px\">the three below are the whole point<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:17px;font-weight:700\">Three things to try for real.<\u002Fp>\n    <p style=\"margin:0;font-size:16px;line-height:1.6\"><span style=\"background:#FDD265;padding:1px 3px\">Write down one thing you didn't fund every quarter and send it to your CFO.<\u002Fspan> One line — here's what I skipped, here's what it costs if it goes wrong. Takes two minutes and it turns a judgement call nobody can see into something you can point at later.<\u002Fp>\n    <p style=\"margin:0;font-size:16px;line-height:1.6\">Find out what your own approval thresholds actually are before you need them. One guy we spoke to knew his exactly — under 10K he just approves it, 10 to 30 needs two quotes, over 30 goes to the board. Knowing that tells you which asks you can just make and which ones need three months of runway.<\u002Fp>\n    <p style=\"margin:0;font-size:16px;line-height:1.6\"><span style=\"background:#FDD265;padding:1px 3px\">When something breaks, ask for money in the same conversation where you fix it.<\u002Fspan> That's the one moment all year when everyone agrees it matters, and people like you tend to spend it fixing things quietly instead.<\u002Fp>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:14px\">\n    <h2 style=\"margin:0;font-family:Lato,sans-serif;font-weight:900;font-size:21px\">5 — How your split compares to everyone else's<\u002Fh2>\n    <p style=\"margin:0;font-size:15px;line-height:1.55;color:#666666\">{{ compareSub }}<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <sc-for list=\"{{ compareRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n        <div style=\"display:flex;align-items:center;gap:14px\">\n          <span style=\"flex:none;width:clamp(140px,32%,210px);font-size:15px\">{{ row.name }}<\u002Fspan>\n          <div style=\"flex:1;min-width:0;height:12px;background:#E8E0CE;position:relative\">\n            <div style=\"height:100%;background:#EDB835;width:{{ row.pct }}%\"><\u002Fdiv>\n          <\u002Fdiv>\n          <span style=\"flex:none;font-size:15px;width:64px;text-align:right\">{{ row.chips }}<\u002Fspan>\n          <span style=\"flex:none;font-size:15px;width:56px;text-align:right;color:#666666\">{{ row.calls }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:15px;line-height:1.55;color:#666666\">Left number is your chips. Right number is how often that domain came up across the 448 calls.<\u002Fp>\n  <\u002Fsection>\n\n  <div style=\"display:flex;flex-wrap:wrap;gap:12px;border-top:3px solid #000;padding-top:20px\">\n    <button type=\"button\" sc-camel-on-click=\"{{ backToScore }}\" style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;background:transparent;border:2px solid #000;border-radius:2px;padding:12px 22px;min-height:44px;cursor:pointer\" style-hover=\"background:#000;color:#F3F0E8\">Back to your score<\u002Fbutton>\n    <button type=\"button\" sc-camel-on-click=\"{{ replay }}\" style=\"font-family:Lato,sans-serif;font-weight:700;font-size:16px;background:#EDB835;border:2px solid #EDB835;border-radius:2px;padding:12px 22px;min-height:44px;cursor:pointer\" style-hover=\"background:#FDD265;border-color:#FDD265\">Play it again<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;typeSpeed&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:60,&quot;step&quot;:5,&quot;unit&quot;:&quot;ms&quot;,&quot;section&quot;:&quot;Motion&quot;},&quot;startScreen&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;title&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;title&quot;,&quot;gate&quot;,&quot;setup&quot;,&quot;allocation&quot;,&quot;predict&quot;,&quot;quarters&quot;,&quot;score&quot;,&quot;onepager&quot;],&quot;section&quot;:&quot;Preview&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'title', typed: 0, bootDone: false,\n    size: null, sector: null, industry: null,\n    chips: { network: 0, servers: 0, backup: 0, security: 0, ai: 0, compliance: 0 },\n    active: 'network', predicted: null,\n    node: 1, phase: 'scene', chosen: null,\n    R: 0, C: 0, E: 0, money: 100, deferrals: 0, path: [],\n    pats: {}, closeUsed: 0, closeLine: '',\n    flags: {}, node3variant: '3b', node4key: 'backup', node4ai: false,\n    barsIn: false, prev: null, replayDelta: '',\n    isMobile: false, reduced: false\n  };\n\n  BOOT = \"technologymatch systems\\nmemory ok  640k\\nloading budget-season\\nready\";\n\n  DOMAINS = [\n    { key: 'network', name: 'Network and connectivity', s: 'Network', tag: 'net', wants: 2, calls: 280, pct: 62 },\n    { key: 'servers', name: 'Servers and virtualisation', s: 'Servers', tag: 'srv', wants: 2, calls: 199, pct: 44 },\n    { key: 'backup', name: 'Backup and recovery', s: 'Backup', tag: 'bkp', wants: 2, calls: 190, pct: 42 },\n    { key: 'security', name: 'Security and identity', s: 'Security', tag: 'sec', wants: 2, calls: 135, pct: 30 },\n    { key: 'ai', name: 'AI and automation', s: 'AI', tag: 'ai', wants: 2, calls: 277, pct: 62 },\n    { key: 'compliance', name: 'Compliance', s: 'Compliance', tag: 'cmp', wants: 2, calls: 162, pct: 36 }\n  ];\n\n  LOCKED = [\n    { name: 'Renewals', count: '14 chips · locked' },\n    { name: 'Licences', count: '11 chips · locked' },\n    { name: 'Headcount', count: '10 chips · locked' }\n  ];\n\n  QUESTIONS = [\n    { key: 'size', title: 'How big is your company?', opts: ['Under 200', '200 to 1,000', '1,000 to 5,000', '5,000+'] },\n    { key: 'sector', title: 'Public sector or private?', opts: ['Public', 'Private'] },\n    { key: 'industry', title: 'What industry?', opts: ['Healthcare', 'Finance', 'Manufacturing', 'Retail', 'Tech', 'Education', 'Something else'] }\n  ];\n\n  N4EVENTS = {\n    backup: \"Somebody needs a restore. It doesn't work. Turns out the data's eleven days old and nobody knew.\",\n    network: \"A site goes dark and it's three days before you can get an engineer out there, because you didn't renew the support contract.\",\n    servers: \"Hardware you put off replacing goes out of support halfway through the quarter and the vendor won't extend it.\",\n    security: \"A login belonging to someone who left last year is still active, and somebody's been using it.\",\n    compliance: \"A deadline you had down for next year moves up.\",\n    ai: \"The pilot you promised has nothing to show and it's on the board agenda.\"\n  };\n\n  N4SHORT = {\n    backup: 'A restore failed in Q4.', network: 'A site went dark in Q4.', servers: 'Hardware went out of support in Q4.',\n    security: 'An old login was still live in Q4.', compliance: 'A deadline moved up in Q4.', ai: 'The pilot had nothing to show in Q4.'\n  };\n  N4CLAUSE = {\n    backup: 'a restore failed', network: 'a site went dark', servers: 'hardware went out of support',\n    security: 'an old login was still live', compliance: 'a deadline moved up', ai: 'the pilot had nothing to show'\n  };\n  N4DID = { A: 'You fixed it out of contingency.', B: 'You patched it.', C: 'You took it upstairs.', D: 'Your team absorbed it.' };\n  N4DIDL = { A: 'you paid for it out of contingency', B: 'you patched it', C: 'you took it upstairs as a funding gap', D: 'your team absorbed it' };\n\n  CLOSE = {\n    away: \"That's twice now you've paid to make something go away.\",\n    defer: \"Second thing you've pushed into next year.\",\n    goodwill: \"You've spent a fair bit of goodwill and it's only Q3.\",\n    price: \"Nothing's broken yet. It's cost you though.\",\n    ask: \"Twice now you've turned a problem into a conversation about money. That's the whole trick.\"\n  };\n  RECEIPT_PAT = {\n    away: 'You paid to make something go away twice.',\n    defer: 'You pushed two things into next year.',\n    goodwill: 'You spent credibility twice.',\n    price: 'You protected the year at a price twice.',\n    ask: 'You turned a problem into an ask twice.'\n  };\n\n  TOUCH = { 1: ['servers'], 2: ['ai'], 3: ['security', 'compliance'], 4: [] };\n\n  NODES = {\n    1: {\n      q: 'q1 · the renewal',\n      scene: \"Your VMware renewal came in asking for 2.4 times what you paid last year. They didn't really give you a heads up about it either, and now that bill is going to eat about a fifth of the budget you've got left for the year.\",\n      quote: { t: '\"Everybody\\u2019s getting out of VMware because of what Broadcom did. They\\u2019re mad about it. Prices are quadrupled and everyone\\u2019s looking to move away. That\\u2019s what we\\u2019re doing too.\"', a: 'IT director, 1,200 people' },\n      opts: [\n        { l: 'A', t: 'Just pay it and get on with the year', r: 8, c: 2, e: 0, spend: 20, tag: 'you made it go away', pat: 'away',\n          v: \"Safe, and it quietly costs you the whole year. You've just spent a fifth of your money on exactly what you already had, and everything that comes up between now and December, you're dealing with less.\" },\n        { l: 'B', t: 'Sign for one year and start looking around', r: 6, c: 4, e: 4, spend: 12, defer: true, tag: 'you bought time', pat: 'defer',\n          v: \"Good call. You bought yourself a year and you didn't sign up for a migration you haven't figured out yet. Just actually use the year, because if you get to next November and you're still sitting where you are now, you'll be having this same conversation with even less room to work with.\",\n          vq: { t: '\"We\\u2019d love to stay with them. But VMware prices have gone through the roof. So we\\u2019re taking a look.\"', a: 'IT manager, two data centres' } },\n        { l: 'C', t: 'Start migrating now and get it over with', r: 2, c: -3, e: 6, spend: 18, tag: 'you took the long way', pat: 'price',\n          v: \"Long term you're probably right. Short term this is going to take up your team for the next six months, so if anything else goes wrong this year you've got nobody free to deal with it. And you've spent a chunk of goodwill on a project the business never asked for and won't notice.\",\n          vq: { t: '\"The support is horrible now. It\\u2019s such a nightmare to get support from them. It was hard before. Now it\\u2019s even worse.\"', a: 'IT director, mid-market manufacturer' } },\n        { l: 'D', t: 'Go to the CFO and ask for more money', r: 5, c: -5, e: 3, spend: 8, tag: 'you spent goodwill', pat: 'goodwill',\n          v: \"It'll probably work, these usually do. But you've just told your CFO that the number you gave her three months ago was wrong, and she's going to remember that a lot longer than she remembers this renewal.\" }\n      ]\n    },\n    2: {\n      q: 'q2 · the AI thing',\n      scene: \"Your CEO got back from a conference and now she wants an AI plan by Friday. She hasn't said what it's for or what problem it solves, but she's said the word \\u201cbehind\\u201d twice, so this one isn't going away on its own.\",\n      context: 'AI came up in 277 of the 448 calls we listened to. More than security. Most of the time somebody above IT brought it up first.',\n      quote: { t: '\"It depends on what I present. If I can show some true cost of the operational efficiencies, they get more receptive. If it\\u2019s just a tradeoff, it may just go, we don\\u2019t see the value proposition here.\"', a: 'IT manager, on who actually decides' },\n      opts: [\n        { l: 'A', t: 'Fund a small pilot somewhere that actually hurts', r: 3, c: 6, e: 4, spend: 8, tag: 'you made it measurable', pat: 'price',\n          v: \"Probably the best you can do here. You've turned a vague \\u201cdo AI\\u201d into something with a number on it, which means in six months it can either work or not work and everyone will be able to tell which.\" },\n        { l: 'B', t: 'Say yes to the whole thing', r: -2, c: 9, e: -4, spend: 20, tag: 'you bought goodwill', pat: 'price',\n          v: \"She's thrilled. You've also just committed money you don't have to something nobody's defined, and when it doesn't do much by Q4 that's going to land on you and not on the conference she went to.\",\n          vq: { t: '\"We really have to demonstrate the ROI. If we can demonstrate ROI on a project like this, I think we could literally do it anytime. I\\u2019d be able to pull the resources if we said this actually had real value.\"', a: 'IT leader, manufacturing' } },\n        { l: 'C', t: 'Push back — no real use case, no money', r: 4, c: -6, e: 5, spend: 0, defer: true, tag: 'you spent goodwill', pat: 'goodwill',\n          v: \"You're almost certainly right and it's going to cost you. Saying no to your CEO is about the most expensive thing you can do with the goodwill you've got, so only do it if you're sure you won't need her for something later in the year.\" },\n        { l: 'D', t: 'Point it at automation work you needed anyway', r: 5, c: 3, e: 6, spend: 10, tag: 'you turned it into an ask', pat: 'ask',\n          v: \"Quietly the best move in here if you can pull it off. You get money for work that was already worth doing, under a banner everyone's excited about. Only works if you can talk about it in her language instead of yours.\",\n          vq: { t: '\"There\\u2019s no budget set aside for this right now. So for me it\\u2019s best of breed. I don\\u2019t want to pay $100,000 for something and then it just doesn\\u2019t work.\"', a: 'Principal decision maker, services company' } }\n      ]\n    },\n    3: {\n      q: 'q3 · something turns up',\n      branchA: 'You put two into security and compliance, so this is the version you can handle.',\n      branchB: 'You left security and compliance short, so this is the other version.',\n      sceneA: \"An audit turns something up. It's real, but it's contained, and most of the fix was already in motion anyway. You've got 60 days.\",\n      sceneB: \"A company about your size, same industry, got hit. It's in the trade press by Tuesday. Wednesday morning a board member emails your CEO one line — \\u201ccould this happen to us?\\u201d — and she forwards it straight to you. She wants something by Monday.\",\n      quoteB: { t: '\"Like a two. I know the doors aren\\u2019t open, but I don\\u2019t know how well they\\u2019re locked.\"', a: 'IT manager, asked to rate his own cloud security out of five' },\n      opts: [\n        { l: 'A', t: \"Tell them the truth — here's the gap, here's what it costs\", r: 6, c: 6, e: 2, spend: 6, tag: 'you turned it into an ask', pat: 'ask',\n          v: \"Right answer and the hard one. You just turned a panicky question into a conversation about money, and you're on record having said what the gap was — which is going to matter a lot if this ever actually happens to you.\" },\n        { l: 'B', t: 'Calm everyone down, then go quietly fix it', r: 4, c: 2, e: 3, spend: 8, tag: 'you handled it quietly', pat: 'price',\n          v: \"Understandable. Everyone calms down and you get on with it. You also just gave away the one moment all year when the board was scared enough to write you a cheque, and that doesn't come back around.\" },\n        { l: 'C', t: 'Spend whatever it takes and close it this quarter', r: 9, c: 1, e: -7, spend: 25, tag: 'you bought in a hurry', pat: 'away',\n          v: \"It works and you pay full price for it. Buying anything in a hurry with the board watching is the most expensive way to do it, and you'll be justifying what you paid for the next two years.\" },\n        { l: 'D', t: 'Bring someone in to assess it properly first', r: 3, c: 4, e: 1, spend: 6, defer: true, tag: 'you pushed it out', pat: 'defer',\n          v: \"Sensible, and slow enough that the decision quietly moves into next year. Fine, as long as nothing happens in the meantime.\" }\n      ]\n    },\n    4: {\n      q: 'q4 · something breaks',\n      opts: [\n        { l: 'A', t: 'Fix it now, out of contingency', r: 10, c: 2, e: -5, spend: 18, tag: 'you made it go away', pat: 'away',\n          v: \"You stopped the bleeding. Contingency's gone now and there's still a quarter to go.\" },\n        { l: 'B', t: 'Patch it and do it properly next year', r: 5, c: 4, e: 4, spend: 6, defer: true, tag: 'you pushed it out', pat: 'defer',\n          v: \"The grown up answer, assuming you actually hold the line. Most people don't, and the temporary fix ends up being the permanent one.\" },\n        { l: 'C', t: 'Take it upstairs as a funding gap, not a screwup', r: 6, c: 7, e: 2, spend: 4, tag: 'you turned it into an ask', pat: 'ask',\n          v: \"Needs more goodwill than you might have. If you've got it, this is the best outcome on the board — the problem stops being yours and starts being the company's.\",\n          vFail: \"You needed more goodwill than you had. It fails in front of everyone, so now it's a funding gap and a credibility gap, and the board meeting is in three weeks.\" },\n        { l: 'D', t: 'Your team eats it — nights and weekends', r: 7, c: 0, e: 6, spend: 2, tag: 'your team absorbed it', pat: 'price',\n          v: \"It works this time. Your best person starts quietly updating their CV and you won't find out until March.\" }\n      ]\n    },\n    5: {\n      q: 'the board meeting',\n      scene: \"You've got twenty minutes on the agenda and you're item six, so really you've got about twelve. The CFO has your Q1 amendment and your Q3 invoice in front of her and she wants to know why you spent it on this instead of something else.\",\n      quote: { t: '\"Under 10K it\\u2019s just, yep, you want this one, it\\u2019s fine. 10 to 30, we need two quotes. 30 and up, three. When it gets to 30 or 40K, it has to go to the board.\"', a: 'IT leader on how approvals actually work where he is' },\n      opts: [\n        { l: 'A', t: \"Start with what didn't happen\", r: 2, c: 5, e: 2, spend: 0,\n          v: \"Honest, and a hard sell. You're basically asking a room full of people to be grateful for things that didn't happen, which only works if you can put a number next to them.\" },\n        { l: 'B', t: 'Start with the tradeoffs you made', r: 3, c: 7, e: 4, spend: 0,\n          v: \"Best way to close it out. You're not defending a budget, you're showing them how you think — and that's the thing that gets you trusted with a bigger one next year.\" },\n        { l: 'C', t: \"Skip the recap, go straight to next year's ask\", r: 1, c: 2, e: 5, spend: 0, defer: true,\n          v: \"Quick, and you've skipped the bit that earns the ask.\",\n          vq: { t: '\"Over a certain amount I have to go through the board. But that\\u2019s just an approval process, not a technology question.\"', a: 'Global director, sole decision maker' } },\n        { l: 'D', t: 'Start with what went wrong', r: 4, c: 6, e: 1, spend: 0, lockR: 22,\n          v: \"Disarming, and it only works if the rest of the year holds up. If it doesn't, you've just handed them the story they're going to tell about you.\" }\n      ]\n    }\n  };\n\n  ARCH = {\n    steward: { n: 'The Steward', t: \"You didn't have a dramatic year, which is the point. Nothing fell over and nobody had to be talked down off anything.\",\n      w: \"Nothing here needs watching yet, which is its own risk. A quiet year is the easiest one to get no credit for, so make sure somebody upstairs knows what didn't happen and why.\",\n      f: \"You spread it thin enough that nothing was left completely exposed, and you spent the goodwill you earned early instead of hoarding it. That's the whole job. The thing to keep an eye on is that a year like this leaves no evidence — nobody remembers the outage that didn't happen.\" },\n    firefighter: { n: 'The Firefighter', t: \"Nothing broke this year, which is good, but you spent a ton of money getting there. Pretty much every time something went wrong you paid your way out of it, and now you've got a stack of invoices you'll be explaining for the next couple of years.\",\n      w: \"You've got no contingency and a CFO with a long memory. The next thing that breaks, you can't buy your way out of it again, and you haven't built the case for the money in advance.\",\n      f: \"You didn't overspend exactly. What you did was take the safe option every single time — paid the renewal in Q1, bought your way out in Q3, dipped into contingency in Q4. Each one made sense on its own. Put together, it meant you never started a quarter with any room, so every problem after that had to be solved with money because you'd run out of time.\" },\n    diplomat: { n: 'The Diplomat', t: \"Everyone upstairs loves you. Meanwhile the actual environment is held together with goodwill and hope, and at some point one of those runs out.\",\n      w: \"The only reason anyone trusts you right now is that nothing's gone wrong. Nobody sees the stuff you quietly handled before it turned into a problem. So the first time something actually does break, you haven't got much to fall back on, and there's no email anywhere showing you saw it coming.\",\n      f: \"You played the room well and the room is happy. What you didn't do was convert any of that into money for the unglamorous things, so the environment is exactly where it was in January while the expectations are considerably higher. Goodwill spends once. Spend it on something that stops a Q4 rather than on being agreeable in a Q2.\" },\n    fortress: { n: 'The Fortress', t: \"You defended one thing really well and left everything else short. Which is fine right up until the thing that breaks isn't the thing you were watching.\",\n      w: \"Everything you didn't fund is still sitting there. You've got one very well defended area and five that nobody has looked at since the allocation, and the next problem picks itself from that list.\",\n      f: \"You made a defensible call and then stuck to it past the point where it was the right one. Security and compliance got what they asked for while the rest of the estate ran on last year's assumptions, and the quarter that went wrong came from the side you weren't facing. The fix isn't to defend less. It's to say out loud, at allocation, which things you are deliberately leaving short.\" },\n    gambler: { n: 'The Gambler', t: \"You put off nearly everything and mostly got away with it. Worth knowing that's what happened, because it won't feel like luck until the year it doesn't work.\",\n      w: \"Every deferral you made is still on the list, and they all come due in the same twelve months. Next year starts with this year's decisions on top of it, and you'll have less room than you had here.\",\n      f: \"Deferring is a real strategy and you used it well enough to finish the year intact. The problem is that nothing you deferred went away, so next January you'll be handed a flat budget with a queue of your own decisions already waiting in it. Write the queue down now, while you can still explain why each one waited.\" },\n    caretaker: { n: 'The Caretaker', t: \"Rough year. Genuinely worth another go — most people play completely differently the second time, once they've seen where this goes.\",\n      w: \"You spent the year reacting, which means the next problem arrives with nothing behind it — no contingency, no goodwill, no case already made. That's the bit to change first, and it's cheaper to change than it looks.\",\n      f: \"Most of this came from the allocation, not from the quarters. You went into the year with everything slightly short, so every decision after that was a choice between two bad options and there was no version where it went well. The fix is upstream: fund fewer things properly rather than all of them a bit, and say which ones you left out.\" }\n  };\n\n  ONEMOVE = {\n    1: \"Signing for one year and looking around would have bought you the time without buying the migration, and you'd have started Q3 with the money still there.\",\n    2: \"Pointing it at automation work you needed anyway gets you the same goodwill with something real to show for it in December.\",\n    3: \"Telling them the truth — the gap, and what it costs to close — turns the panic into a conversation about money while they're still listening.\",\n    4: \"Taking it upstairs as a funding gap rather than a screwup makes it the company's problem instead of yours, and it's the cheapest thing on that screen.\",\n    5: \"Starting with the tradeoffs you made shows them how you think, and that's what gets you trusted with a bigger number next year.\"\n  };\n\n  BEST = { 1: 'B', 2: 'D', 3: 'A', 4: 'C', 5: 'B' };\n  QUARTER_LABEL = { 1: 'Q1', 2: 'Q2', 3: 'Q3', 4: 'Q4', 5: 'the board meeting' };\n  RMIN = 6; RMAX = 36; CMIN = -14; CMAX = 33; EMIN = -15; EMAX = 26;\n\n  componentDidMount() {\n    this.sync = () => this.setState({ isMobile: window.innerWidth < 760, wide: window.innerWidth >= 1250 });\n    window.addEventListener('resize', this.sync);\n    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');\n    let fromForm = false;\n    try {\n      fromForm = new URLSearchParams(window.location.search).get('gate') === 'done';\n      if (fromForm) {\n        window.localStorage.setItem('bs_gate_done', '1');\n        window.history.replaceState({}, '', window.location.pathname + window.location.hash);\n      }\n    } catch (e) { fromForm = false; }\n    this.setState({ isMobile: window.innerWidth < 760, wide: window.innerWidth >= 1250, reduced: mq.matches }, () => {\n      const s = this.pr ? shown(st.verdictText) : '';\n      v.cursorVerdict = cursor && st.phase === 'result' && typing;\n      v.showVerdictQuote = st.phase === 'result' && !typing && !!st.verdictQuote;\n      v.verdictQuote = st.verdictQuote ? st.verdictQuote.t : '';\n      v.verdictQuoteAttr = st.verdictQuote ? st.verdictQuote.a : '';\n      v.showCloseLine = st.phase === 'result' && !typing && !!st.closeLine;\n      v.closeLine = st.closeLine;\n      v.awaitingChoice = st.phase === 'scene' && !typing;\n      v.canContinue = st.phase === 'result' && !typing;\n      v.cursorPrompt = cursor;\n      v.next = this.next;\n      v.boardDir = st.isMobile ? 'column' : 'row';\n      v.saidLines = st.path.filter(p => p.node <= 4).map(p => p.t).concat(st.chosen && st.node === 5 ? [node.opts.find(o => o.l === st.chosen).t] : []);\n      v.showDeltas = st.phase === 'result' && !typing;\n      v.boardDeltas = ['resilience ' + this.fmt(this.lastDelta('r')), 'credibility ' + this.fmt(this.lastDelta('c')), 'efficiency ' + this.fmt(this.lastDelta('e'))].join('   ');\n    }\n\n    if (isScore) {\n      v.boardScene = st.phase === 'scene';\n      v.boardResult = st.phase === 'result';\n      const mk = (label, pct, pts, cap, delay) => ({\n        label: label, value: pts + ' / ' + cap, pct: st.barsIn ? pct : 0, delay: delay,\n        color: pct >= 75 ? '#54A966' : (pct <= 30 ? '#B12031' : '#EDB835')\n      });\n      v.total = s.total;\n      v.receipt = this.receipt();\n      v.bars = [mk('resilience', s.rp, s.rPts, 40, 0), mk('credibility', s.cp, s.cPts, 35, 140), mk('efficiency', s.ep, s.ePts, 25, 280)];\n      v.archName = arch.n; v.archText = arch.t;\n      const gapNode = this.bestGapNode();\n      const mine = st.path.find(p => p.node === gapNode);\n      v.oneMoveHead = 'If you change one thing, change ' + this.QUARTER_LABEL[gapNode] + '.';\n      v.oneMoveBody = (mine ? 'You ' + mine.t.charAt(0).toLowerCase() + mine.t.slice(1) + '. ' : '') + this.ONEMOVE[gapNode];\n      if (gapNode === 1 && mine
